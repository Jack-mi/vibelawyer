[project]
name = "vibelawyer"
version = "0.1.1"
description = "Local MCP server for Chinese criminal case dossier review — generates Word notes and Excel catalogs on your machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jack-mi" }]
keywords = [
    "mcp",
    "fastmcp",
    "legal",
    "criminal-law",
    "dossier",
    "case-review",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pypdfium2>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10",
    "numpy>=1.26",
    "fastmcp>=3.4.4,<4",
]

[project.optional-dependencies]
legacy-agent = ["claude-agent-sdk>=0.2.101"]

[project.urls]
Homepage = "https://github.com/Jack-mi/vibelawyer"
Repository = "https://github.com/Jack-mi/vibelawyer"
Issues = "https://github.com/Jack-mi/vibelawyer/issues"

[project.scripts]
vibelawyer = "vibelawyer.run:main"
vibelawyer-mcp = "vibelawyer.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibelawyer"]
